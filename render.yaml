services:
  - type: web
    name: lms-backend-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: STORAGE_BACKEND
        value: local
      - key: CORS_ORIGINS
        value: https://papaya-halva-69a7bc.netlify.app,https://lms-fullstack-vibe.netlify.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://papaya-halva-69a7bc.netlify.app
